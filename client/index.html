<!doctype html>
<html lang="fa" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Kronos Guard — Owner Console</title>
    <style id="kronos-first-paint-theme">html,body,#root{margin:0;min-height:100%;background:#050913;color:#d9faff;color-scheme:dark}body{overflow-x:hidden}</style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || stored === null || (stored === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.backgroundColor = dark ? "#050913" : "#f8fafc";
          document.documentElement.style.color = dark ? "#d9faff" : "#172033";
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      }());
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root">
      <main dir="rtl" lang="fa" aria-live="polite" style="display:grid;min-height:100dvh;place-items:center;padding:24px;background:#050913;color:#d9faff;font-family:system-ui,sans-serif;text-align:center">
        <section style="max-width:360px;border:1px solid rgba(103,232,249,.24);border-radius:20px;padding:24px;background:rgba(15,23,42,.86)">
          <strong style="display:block;font-size:20px">Kronos Guard</strong>
          <p style="margin:12px 0;color:#94a3b8">در حال آماده‌سازی پنل امن تلگرام…</p>
          <a href="/dashboard" style="color:#a5f3fc">تلاش دوباره برای بازکردن داشبورد</a>
        </section>
      </main>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var showDiagnostic = function (message) {
          if (!root || root.dataset.reactMounted === "true") return;
          root.innerHTML = '<main dir="rtl" lang="fa" style="display:grid;min-height:100dvh;place-items:center;padding:24px;background:#050913;color:#d9faff;font-family:system-ui,sans-serif;text-align:center"><section style="max-width:380px;border:1px solid rgba(248,113,113,.42);border-radius:20px;padding:24px;background:rgba(15,23,42,.92)"><strong style="display:block;font-size:20px">Kronos Guard</strong><p style="margin:12px 0;color:#fecaca">بارگذاری پنل در Telegram WebView با خطا روبه‌رو شد.</p><p style="margin:0 0 16px;color:#94a3b8;font-size:12px">' + message + '</p><a href="/dashboard" style="color:#a5f3fc">تلاش دوباره</a></section></main>';
        };
        window.addEventListener("error", function () { showDiagnostic("خطای اجرای رابط؛ لطفاً WebView را ببندید و دوباره باز کنید."); });
        window.addEventListener("unhandledrejection", function () { showDiagnostic("خطای ارتباط یا احراز هویت؛ لطفاً دوباره تلاش کنید."); });
        window.setTimeout(function () {
          if (!root || root.dataset.reactMounted === "true") return;
          showDiagnostic("زمان بارگذاری بیش از حد طول کشید.");
        }, 12000);
      }());
    </script>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
